services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --profile app
  app:
    build: .
    profiles: [ app ]
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taskboard
      JWT_SECRET: change-me-in-production-at-least-32-bytes
    ports:
      - "8080:8080"

volumes:
  pgdata:
