spring.application.name=taskboard

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
spring.datasource.username=${DB_USER:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

taskboard.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-0123456789}
taskboard.jwt.ttl=1h

spring.data.web.pageable.max-page-size=100
